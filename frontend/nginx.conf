# Static SPA host. The app has no server-side routing (navigation is
# client state, not URL paths), but try_files keeps deep links / refreshes
# working if that ever changes. All API and WebSocket traffic goes straight
# from the browser to the backend's own published port (VITE_API_BASE_URL) —
# nginx does not proxy it.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames — safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
